<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090806">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Сити-Центр · Презентация</title>
  <link rel="icon" type="image/svg+xml" href="brand.svg">
  <link rel="stylesheet" href="access.css">
  <script defer src="fflate.js"></script>
  <script defer src="access.js"></script>
</head>
<body>
  <main id="gate">
    <section class="access-card" aria-labelledby="access-title">
      <img class="brand" src="brand.svg" alt="Сити-Центр недвижимости" width="210" height="75">
      <p class="eyebrow">ПРЕЗЕНТАЦИЯ КОМПАНИИ</p>
      <h1 id="access-title">Новая <span>география.</span></h1>
      <p class="intro">Введите пароль, чтобы открыть презентацию.</p>
      <form id="access-form">
        <label for="password">Пароль</label>
        <div class="password-field">
          <input id="password" name="password" type="password" required autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="access-status">
          <button type="button" id="show-password" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <button class="submit" id="submit" type="submit"><span>Открыть презентацию</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></button>
        <p id="access-status" role="status" aria-live="polite"></p>
      </form>
      <noscript>Для открытия презентации включите JavaScript в браузере.</noscript>
    </section>
  </main>
  <div id="viewer" hidden></div>
</body>
</html>
