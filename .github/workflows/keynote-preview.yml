name: Verify published keynote
on:
  push:
    branches: [keynote-first-six-20261103]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public files against the tested build
        run: python _keynote/verify-public.py
      - name: Save publication evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _keynote/out/public-report.json
          if ! git diff --cached --quiet
          then
            git commit -m 'Save public keynote verification [skip ci]'
            git push origin HEAD:keynote-first-six-20261103
          fi
