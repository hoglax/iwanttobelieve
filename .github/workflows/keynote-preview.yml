name: Keynote first six preview
on:
  push:
    branches: [keynote-first-six-20261103]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview dependencies
        run: |
          python -m pip install Pillow playwright PyMuPDF
          python -m playwright install --with-deps chromium
      - name: Restore source snapshot for repeatable refresh
        run: |
          git restore --source=c2b93ef880264167965f7465a22ebe1dc30f3be3 -- index.html assets PHOTO-CREDITS.md README.md
      - name: Build the requested first six slides
        run: python _keynote/refresh.py
      - name: Check presentation and export preview
        run: python _keynote/check.py
      - name: Save reviewable assets and evidence on the isolated branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets PHOTO-CREDITS.md README.md _keynote/out
          if ! git diff --cached --quiet
          then
            git commit -m 'Build first-six keynote preview and verification evidence [skip ci]'
            git push origin HEAD:keynote-first-six-20261103
          fi
